name: CI

on:
  # Each pull request is built and tested before it merges, and merging rebases it onto main,
  # so main is not built again: a macOS minute counts ten times against a private repository's
  # quota. Run the workflow by hand (Actions › CI › Run workflow) to build main.
  pull_request:
    # Documentation alone needs no build.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# A new push to a pull request cancels the run still going for the one before it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # The package still builds the app, for `swift run` and the debug hooks.
      - name: Build (Swift package)
        run: swift build

      - name: Test
        run: swift test

      - name: Build app (Xcode project, ad hoc signed)
        run: MIMAMORI_SIGN=adhoc Scripts/make-app.sh release

      - name: Zip app
        run: ditto -c -k --keepParent build/Mimamori.app build/Mimamori-unsigned.zip

      # Convenience only: artifact storage on private repositories is quota-limited,
      # so a failed upload must not fail the build.
      - name: Upload app (ad-hoc signed, not notarized)
        uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: Mimamori-unsigned
          path: build/Mimamori-unsigned.zip
          retention-days: 7

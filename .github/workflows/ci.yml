name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build and test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Bundle app
        run: Scripts/make-app.sh release

      - name: Zip app
        run: ditto -c -k --keepParent build/Vigil.app build/Vigil-unsigned.zip

      # Convenience only: artifact storage on private repositories is quota-limited,
      # so a failed upload must not fail the build.
      - name: Upload app (ad-hoc signed, not notarized)
        uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: Vigil-unsigned
          path: build/Vigil-unsigned.zip
          retention-days: 7

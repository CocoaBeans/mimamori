name: CodeQL

on:
  # Like CI: each pull request, and main once it lands. GitHub's default setup can't skip
  # documentation, so this advanced setup replaces it.
  pull_request:
    # Documentation and the website hold no code to analyze.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  # Weekly as well, since new queries can find problems in code that hasn't changed.
  schedule:
    - cron: '27 6 * * 1'
  workflow_dispatch:

# Each job asks for what it needs below; nothing else gets the token.
permissions: {}

# A new push to a pull request cancels the run still going for the one before it.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The workflows themselves, read without a build.
          - language: actions
            runner: ubuntu-latest
            build-mode: none
          - language: swift
            runner: macos-15
            build-mode: manual
    steps:
      - uses: actions/checkout@v5

      # Before CodeQL starts tracing, which makes every tool slow to launch.
      - name: Toolchain
        if: matrix.language == 'swift'
        run: |
          xcodebuild -version
          swift --version

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # CodeQL analyzes what this step compiles. The package builds everything but the widget
      # extension's one file of its own. Autobuild can't read the Xcode project (its workspace file
      # isn't committed) and falls back to this anyway; xcodebuild spends minutes starting up under
      # the tracer.
      - name: Build (Swift package)
        if: matrix.language == 'swift'
        run: swift build

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
